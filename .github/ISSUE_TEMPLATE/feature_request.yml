name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Describe what you would like to see. Mockups welcome.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Can you help build it?
      options:
        - label: I'd like to work on this
